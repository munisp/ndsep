name: NDSEP CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging, production, "devin/**"]
  pull_request:
    branches: [main, develop, staging, production]

env:
  NODE_VERSION: "22"
  GO_VERSION: "1.25.0"
  PYTHON_VERSION: "3.12"
  RUST_VERSION: "stable"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Node.js / TypeScript — tRPC server + React client
  # ─────────────────────────────────────────────────────────────────────────────
  node-ci:
    name: Node.js CI (TypeScript + Tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ndsep_user
          POSTGRES_PASSWORD: ndsep_test_pass
          POSTGRES_DB: ndsep_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ndsep_user:ndsep_test_pass@localhost:5432/ndsep_test
      JWT_SECRET: test-jwt-secret-for-ci-only
      FIELD_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: "10.4.1" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec drizzle-kit push --force
        name: Apply database migrations
      - run: pnpm exec tsc --noEmit
        name: TypeScript check
      - run: pnpm lint
        name: Lint the root web and API project
      - run: pnpm test --reporter=verbose
        name: Unit tests
      - run: pnpm run build
        name: Build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/

  # ─────────────────────────────────────────────────────────────────────────────
  # Mobile app — independent dependency graph and quality gates
  # ─────────────────────────────────────────────────────────────────────────────
  mobile-ci:
    name: Mobile CI (TypeScript + Lint + Tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ndsep_payment_test
          POSTGRES_PASSWORD: ndsep_payment_test_pass
          POSTGRES_DB: idlr_payment_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PAYMENT_AUDIT_POSTGRES_URL: postgresql://ndsep_payment_test:ndsep_payment_test_pass@localhost:5432/idlr_payment_test
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.34.4"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
        name: Mobile TypeScript check
      - run: pnpm lint
        name: Mobile lint
      - run: pnpm test
        name: Mobile unit tests

  # ─────────────────────────────────────────────────────────────────────────────
  # Go workers — build + vet + test all 15 workers
  # ─────────────────────────────────────────────────────────────────────────────
  go-ci:
    name: Go CI (Build + Vet + Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: workers/go/go.sum
      - name: Download Go dependencies
        working-directory: workers/go
        run: go mod download
      - name: Go vet (all workers)
        working-directory: workers/go
        run: |
          for dir in cmd/*/; do
            echo "Vetting $dir..."
            go vet ./$dir || exit 1
          done
      - name: Go build (all workers)
        working-directory: workers/go
        run: |
          mkdir -p bin
          for dir in cmd/*/; do
            name=$(basename $dir)
            echo "Building $name..."
            go build -ldflags="-s -w -X main.Version=${{ github.sha }}" -o bin/$name ./$dir || exit 1
          done
      - name: Go test
        working-directory: workers/go
        run: go test ./... -v -timeout 60s
      - uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: workers/go/bin/

  # ─────────────────────────────────────────────────────────────────────────────
  # Go orchestration services — independent module with production gateway and IAM
  # ─────────────────────────────────────────────────────────────────────────────
  go-orchestration-ci:
    name: Go Orchestration CI (Build + Vet + Test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: orchestration/go/go.sum
      - name: Download orchestration dependencies
        working-directory: orchestration/go
        run: go mod download
      - name: Verify orchestration module
        working-directory: orchestration/go
        run: |
          go vet ./...
          go test ./... -timeout 90s

  # ─────────────────────────────────────────────────────────────────────────────
  # Python orchestration services
  # ─────────────────────────────────────────────────────────────────────────────
  python-ci:
    name: Python CI (Lint + Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 pytest pytest-asyncio
          find orchestration services/python -name requirements.txt -exec pip install -r {} \;
      - name: Lint with flake8
        run: flake8 orchestration/ workers/python/ --max-line-length=120 --ignore=E501,W503,W504
      - name: Compile Python services
        run: python -m compileall -q orchestration/ services/python/ workers/python/
      - name: Run Python tests
        run: pytest orchestration/ -v --tb=short
      - name: Python security scan (bandit)
        run: |
          pip install bandit
          bandit -r workers/python/ orchestration/ -lll -ii --format json -o bandit-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-security
          path: bandit-results.json

  # ─────────────────────────────────────────────────────────────────────────────
  # Rust workers
  # ─────────────────────────────────────────────────────────────────────────────
  rust-ci:
    name: Rust CI (Check + Test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workers/rust -> target
      - name: Rust format check
        working-directory: workers/rust
        run: cargo fmt --check
      - name: Rust clippy (deny warnings)
        working-directory: workers/rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust security audit
        run: |
          cargo install cargo-audit --locked
          cd workers/rust && cargo audit
      - name: Rust build
        working-directory: workers/rust
        run: cargo build --release
      - name: Rust tests
        working-directory: workers/rust
        run: cargo test --release

  # ─────────────────────────────────────────────────────────────────────────────
  # Security scanning
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/src:ro" \
            --volume "$PWD:/out" \
            aquasec/trivy:0.65.0 \
            fs /src \
            --format sarif \
            --output /out/trivy-results.sarif \
            --severity HIGH,CRITICAL \
            --ignore-unfixed=false \
            --exit-code 1
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem-main-ci
      - uses: pnpm/action-setup@v4
        with:
          version: "10.34.4"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install locked dependency graph for audit
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit npm packages (fail on high/critical)
        run: pnpm audit --audit-level=high

  # ─────────────────────────────────────────────────────────────────────────────
  # Integration tests (E2E with Playwright)
  # ─────────────────────────────────────────────────────────────────────────────
  integration:
    name: Integration Tests (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [node-ci]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/production'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ndsep_user
          POSTGRES_PASSWORD: ndsep_test_pass
          POSTGRES_DB: ndsep_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ndsep_user:ndsep_test_pass@localhost:5432/ndsep_test
      JWT_SECRET: test-jwt-secret-for-ci-only
      FIELD_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      BASE_URL: http://127.0.0.1:3000
      E2E_BASE_URL: http://127.0.0.1:3000
      NODE_ENV: test
      # The isolated E2E database is initialized by drizzle-kit before server start.
      SKIP_DATABASE_MIGRATIONS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: "10.4.1" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm exec drizzle-kit push --force
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start server and verify readiness
        run: |
          pnpm run build
          NODE_ENV=test node dist/index.js > /tmp/ndsep-server.log 2>&1 &
          echo $! > /tmp/ndsep-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ndsep-server.log
          exit 1
      - run: pnpm run e2e:release-smoke:chromium
        name: Run release-smoke Chromium E2E tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results/

  # ─────────────────────────────────────────────────────────────────────────────
  # Docker build + push (on main branch only)
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [node-ci, go-ci, python-ci, security]
    if: github.ref == 'refs/heads/production'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
