name: NDSEP CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging, production, "devin/**"]
  pull_request:
    branches: [main, develop, staging, production]

env:
  NODE_VERSION: "22"
  GO_VERSION: "1.25.0"
  PYTHON_VERSION: "3.12"
  RUST_VERSION: "stable"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Node.js / TypeScript — tRPC server + React client
  # ─────────────────────────────────────────────────────────────────────────────
  node-ci:
    name: Node.js CI (TypeScript + Tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ndsep_user
          POSTGRES_PASSWORD: ndsep_test_pass
          POSTGRES_DB: ndsep_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ndsep_user:ndsep_test_pass@localhost:5432/ndsep_test
      WEBHOOK_LEDGER_TEST_DATABASE_URL: postgresql://ndsep_user:ndsep_test_pass@localhost:5432/ndsep_test
      PAYMENT_COMMAND_TEST_DATABASE_URL: postgresql://ndsep_user:ndsep_test_pass@localhost:5432/ndsep_test
      THEME_PREFERENCES_TEST_DATABASE_URL: postgresql://ndsep_user:ndsep_test_pass@localhost:5432/ndsep_theme_preferences_integration
      JWT_SECRET: test-jwt-secret-for-ci-only
      FIELD_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: "10.4.1" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec drizzle-kit push --force
        name: Apply database migrations
      - run: pnpm exec tsc --noEmit
        name: TypeScript check
      - name: Create isolated PostgreSQL database for theme-preferences router integration
        env:
          PGPASSWORD: ndsep_test_pass
        run: |
          set -euo pipefail
          psql --host=localhost --username=ndsep_user --dbname=postgres --set=ON_ERROR_STOP=1 <<'SQL'
          DROP DATABASE IF EXISTS ndsep_theme_preferences_integration;
          CREATE DATABASE ndsep_theme_preferences_integration;
          SQL
      - run: pnpm lint
        name: Lint the root web and API project
      - run: pnpm test --reporter=verbose
        name: Unit tests
      - run: pnpm run build
        name: Build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/

  # ─────────────────────────────────────────────────────────────────────────────
  # Mobile app — independent dependency graph and quality gates
  # ─────────────────────────────────────────────────────────────────────────────
  mobile-ci:
    name: Mobile CI (TypeScript + Lint + Tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ndsep_payment_test
          POSTGRES_PASSWORD: ndsep_payment_test_pass
          POSTGRES_DB: idlr_payment_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PAYMENT_AUDIT_POSTGRES_URL: postgresql://ndsep_payment_test:ndsep_payment_test_pass@localhost:5432/idlr_payment_test
      MOBILE_POSTGRES_TEST_DATABASE_URL: postgresql://ndsep_payment_test:ndsep_payment_test_pass@localhost:5432/idlr_payment_test
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.34.4"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec drizzle-kit migrate
        name: Apply mobile PostgreSQL migrations to disposable CI database
        env:
          DATABASE_URL: ${{ env.MOBILE_POSTGRES_TEST_DATABASE_URL }}
      - run: pnpm check
        name: Mobile TypeScript check
      - run: pnpm lint
        name: Mobile lint
      - run: pnpm test
        name: Mobile unit tests

  # ─────────────────────────────────────────────────────────────────────────────
  # Go workers — build + vet + test all 15 workers
  # ─────────────────────────────────────────────────────────────────────────────
  go-ci:
    name: Go CI (Build + Vet + Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: workers/go/go.sum
      - name: Download Go dependencies
        working-directory: workers/go
        run: go mod download
      - name: Go vet (all workers)
        working-directory: workers/go
        run: |
          for dir in cmd/*/; do
            echo "Vetting $dir..."
            go vet ./$dir || exit 1
          done
      - name: Go build (all workers)
        working-directory: workers/go
        run: |
          mkdir -p bin
          for dir in cmd/*/; do
            name=$(basename $dir)
            echo "Building $name..."
            go build -ldflags="-s -w -X main.Version=${{ github.sha }}" -o bin/$name ./$dir || exit 1
          done
      - name: Go test
        working-directory: workers/go
        run: go test ./... -v -timeout 60s
      - uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: workers/go/bin/

  # ─────────────────────────────────────────────────────────────────────────────
  # Go orchestration services — independent module with production gateway and IAM
  # ─────────────────────────────────────────────────────────────────────────────
  go-orchestration-ci:
    name: Go Orchestration CI (Build + Vet + Test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: orchestration/go/go.sum
      - name: Download orchestration dependencies
        working-directory: orchestration/go
        run: go mod download
      - name: Verify orchestration module
        working-directory: orchestration/go
        run: |
          go vet ./...
          go test ./... -timeout 90s

  # ─────────────────────────────────────────────────────────────────────────────
  # Python orchestration services
  # ─────────────────────────────────────────────────────────────────────────────
  python-ci:
    name: Python CI (Lint + Test)
    runs-on: ubuntu-latest
    env:
      DPCO_ANALYTICS_DATABASE_URL: postgresql://ndsep_ci:ndsep_ci_local_only@127.0.0.1:5432/ndsep_ci?sslmode=disable
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: ndsep_ci
          POSTGRES_PASSWORD: ndsep_ci_local_only
          POSTGRES_DB: ndsep_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ndsep_ci -d ndsep_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 pytest pytest-asyncio fastapi uvicorn pydantic requests "psycopg[binary,pool]"
          find orchestration services/python -name requirements.txt -exec pip install -r {} \;
      - name: Lint with flake8
        run: flake8 orchestration/ workers/python/ --max-line-length=120 --ignore=E501,W503,W504
      - name: Compile Python services
        run: python -m compileall -q orchestration/ services/python/ workers/python/
      - name: Run Python tests
        run: pytest orchestration/ -v --tb=short
      - name: Python security scan (bandit)
        run: |
          pip install bandit
          bandit -r workers/python/ orchestration/ -lll -ii --format json -o bandit-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-security
          path: bandit-results.json

  # ─────────────────────────────────────────────────────────────────────────────
  # Rust workers
  # ─────────────────────────────────────────────────────────────────────────────
  rust-ci:
    name: Rust CI (Check + Test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ndsep_rust_ci
          POSTGRES_PASSWORD: ndsep_rust_ci_local_only
          POSTGRES_DB: ndsep_rust_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LAKEHOUSE_INGEST_TEST_DATABASE_URL: postgresql://ndsep_rust_ci:ndsep_rust_ci_local_only@127.0.0.1:5432/ndsep_rust_ci
      LAKEHOUSE_WRITER_TEST_DATABASE_URL: postgresql://ndsep_rust_ci:ndsep_rust_ci_local_only@127.0.0.1:5432/ndsep_rust_ci
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workers/rust -> target
      - name: Rust format check
        working-directory: workers/rust
        run: cargo fmt --check
      - name: Rust clippy (deny warnings)
        working-directory: workers/rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust security audit
        run: |
          cargo install cargo-audit --locked
          cd workers/rust && cargo audit
      - name: Rust build
        working-directory: workers/rust
        run: cargo build --release
      - name: Rust tests
        working-directory: workers/rust
        run: cargo test --release

  # ─────────────────────────────────────────────────────────────────────────────
  # Security scanning
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/src:ro" \
            --volume "$PWD:/out" \
            aquasec/trivy:0.65.0 \
            fs /src \
            --format sarif \
            --output /out/trivy-results.sarif \
            --severity HIGH,CRITICAL \
            --ignore-unfixed=false \
            --exit-code 1
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem-main-ci
      - uses: pnpm/action-setup@v4
        with:
          version: "10.34.4"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install locked dependency graph for audit
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit npm packages (fail on high/critical)
        run: pnpm audit --audit-level=high

  # ─────────────────────────────────────────────────────────────────────────────
  # Integration tests (E2E with Playwright)
  # ─────────────────────────────────────────────────────────────────────────────
  integration:
    name: Integration Tests (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [node-ci]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/production'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ndsep_user
          POSTGRES_PASSWORD: ndsep_test_pass
          POSTGRES_DB: ndsep_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ndsep_user:ndsep_test_pass@localhost:5432/ndsep_test
      JWT_SECRET: test-jwt-secret-for-ci-only
      FIELD_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      BASE_URL: http://127.0.0.1:3000
      E2E_BASE_URL: http://127.0.0.1:3000
      NODE_ENV: test
      # The isolated E2E database is initialized by drizzle-kit before server start.
      SKIP_DATABASE_MIGRATIONS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: "10.4.1" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm exec drizzle-kit push --force
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start server and verify readiness
        run: |
          pnpm run build
          NODE_ENV=test node dist/index.js > /tmp/ndsep-server.log 2>&1 &
          echo $! > /tmp/ndsep-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ndsep-server.log
          exit 1
      - run: pnpm run e2e:release-smoke:chromium
        name: Run release-smoke Chromium E2E tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results/

  # ─────────────────────────────────────────────────────────────────────────────
  # Schema drift verification — protected, read-only staging comparison
  # ─────────────────────────────────────────────────────────────────────────────
  schema-drift-verification:
    name: Protected Staging Schema Drift Verification
    runs-on: ubuntu-latest
    # Reuse the intended production release boundary. Authorized administrators
    # must configure required reviewers, prevent bypass, and load read-only
    # baseline/staging URLs before this gate can execute.
    environment:
      name: production-release
    if: github.ref == 'refs/heads/production'
    permissions:
      contents: read
    env:
      SCHEMA_DRIFT_BASELINE_DATABASE_URL: ${{ secrets.SCHEMA_DRIFT_BASELINE_DATABASE_URL }}
      SCHEMA_DRIFT_STAGING_DATABASE_URL: ${{ secrets.SCHEMA_DRIFT_STAGING_DATABASE_URL }}
      # Optional PEM bundle for a private staging PostgreSQL CA. Verification
      # remains mandatory whether this secret is supplied or the runner trust store is used.
      SCHEMA_DRIFT_DB_SSL_CA_PEM: ${{ secrets.SCHEMA_DRIFT_DB_SSL_CA_PEM }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.34.4"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install locked dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compare protected staging schema with clean baseline
        run: node scripts/ci/verify-staging-schema-drift.mjs > schema-drift-verification.json
      - name: Upload sanitized schema-drift result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-verification-${{ github.sha }}
          path: schema-drift-verification.json
          if-no-files-found: warn
          retention-days: 365

  # ─────────────────────────────────────────────────────────────────────────────
  # Docker candidate build + signed digest evidence (protected production push)
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    # This environment must be created and protected by an authorized GitHub
    # administrator. Its reviewers gate registry publication after all CI passes.
    environment:
      name: production-release
    needs:
      [
        node-ci,
        go-ci,
        go-orchestration-ci,
        python-ci,
        rust-ci,
        security,
        integration,
        schema-drift-verification,
      ]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    if: github.ref == 'refs/heads/production'
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
      COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable candidate
        id: build_image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:candidate-${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
      - name: Resolve immutable image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail
          digest='${{ steps.build_image.outputs.digest }}'
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=${IMAGE_NAME}@${digest}" >> "$GITHUB_OUTPUT"
      - name: Direct candidate image scan (HIGH/CRITICAL gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: json
          output: release-evidence/trivy-image.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          vuln-type: os,library
      - name: Generate candidate CycloneDX SBOM
        if: success()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: cyclonedx
          output: release-evidence/image-sbom.cdx.json
          vuln-type: os,library
      - name: Verify digest-bound scan and SBOM evidence
        if: success()
        run: |
          bash scripts/security/verify-release-image-evidence.sh \
            "$IMAGE_NAME" \
            "${{ steps.image.outputs.digest }}" \
            "${{ github.sha }}" \
            release-evidence/trivy-image.json \
            release-evidence/image-sbom.cdx.json \
            release-evidence/release-evidence.json
      - name: Attest build provenance to GHCR
        if: success()
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Install Cosign
        if: success()
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
      - name: Keylessly sign verified image digest
        if: success()
        run: cosign sign --yes "${{ steps.image.outputs.ref }}"
      - name: Verify keyless signature and GitHub provenance
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "$COSIGN_CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$COSIGN_OIDC_ISSUER" \
            --output json \
            "${{ steps.image.outputs.ref }}" > release-evidence/cosign-verify.json
          gh attestation verify \
            "oci://${{ steps.image.outputs.ref }}" \
            --repo "$GITHUB_REPOSITORY" > release-evidence/github-provenance-verify.txt
      - name: Normalize verified candidate evidence for readiness gate
        if: success()
        env:
          EVIDENCE_URI_PREFIX: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/release-evidence-${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/ci/normalize-release-evidence.mjs \
            --image "${{ steps.image.outputs.ref }}" \
            --source-commit "${{ github.sha }}" \
            --built-at "${{ github.event.head_commit.timestamp }}" \
            --trivy release-evidence/trivy-image.json \
            --trivy-uri "$EVIDENCE_URI_PREFIX/trivy-image.json" \
            --sbom release-evidence/image-sbom.cdx.json \
            --sbom-uri "$EVIDENCE_URI_PREFIX/image-sbom.cdx.json" \
            --provenance release-evidence/github-provenance-verify.txt \
            --provenance-uri "$EVIDENCE_URI_PREFIX/github-provenance-verify.txt" \
            --cosign release-evidence/cosign-verify.json \
            --cosign-uri "$EVIDENCE_URI_PREFIX/cosign-verify.json" \
            --certificate-identity "$COSIGN_CERTIFICATE_IDENTITY" \
            --out-dir release-evidence
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: warn
          retention-days: 365
