name: Polyglot Emulator Validation
on:
  pull_request:
  push:
    branches: [main, production]
permissions:
  contents: read
jobs:
  go-event-gateway:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/go-event-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23.x" }
      - run: go test ./...
  rust-policy-engine:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/rust-policy-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --locked
  python-compliance-api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/python-compliance-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --upgrade pip fastapi pydantic
      - run: python -m compileall -q app.py
