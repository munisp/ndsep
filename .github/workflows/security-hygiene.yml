name: Security Hygiene
on:
  pull_request:
  push:
    branches: [main, production]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      payment-audit-postgres:
        image: postgres:16.4-bookworm
        env:
          POSTGRES_DB: idlr_payment
          POSTGRES_USER: idlr_tests
          POSTGRES_PASSWORD: idlr_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idlr_tests -d idlr_payment"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PAYMENT_AUDIT_POSTGRES_URL: postgresql://idlr_tests:idlr_tests@127.0.0.1:5432/idlr_payment
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm audit --prod --audit-level=high
