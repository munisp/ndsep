name: Staging Supervisory API Acceptance

on:
  pull_request:
    branches: [main, develop, staging, production]
    paths:
      - 'tests/supervisory-api-contract/**'
      - 'server/**'
      - 'drizzle/**'
      - 'infra/**'
      - '.github/workflows/staging-supervisory-api-acceptance.yml'
  deployment_status:
  workflow_dispatch:
    inputs:
      expected_release_digest:
        description: 'Required full sha256 digest of the already deployed staging candidate'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-supervisory-api-acceptance-${{ github.event.deployment.id || github.run_id }}
  cancel-in-progress: false

jobs:
  unit-contract:
    name: Supervisory API contract unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run dependency-free response-contract checks
        working-directory: tests/supervisory-api-contract
        run: node --test test/schema-contract.test.mjs

  staging-mtls-contract:
    name: Staging mTLS supervisory API acceptance
    needs: unit-contract
    # This job must run only from a trusted successful staging deployment or from an
    # environment-protected manual revalidation. It never runs on pull_request events.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment.environment == 'staging' &&
       github.event.deployment_status.state == 'success')
    runs-on: [self-hosted, linux, ndsep-staging-internal]
    environment: staging-supervisory-acceptance
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Every deployment controller must include the full published OCI digest in
      # deployment.payload.image_digest. A moving tag/commit SHA is rejected by the test.
      EXPECTED_RELEASE_DIGEST: ${{ inputs.expected_release_digest || github.event.deployment.payload.image_digest }}
      CBN_TEST_BASE_URL: ${{ secrets.CBN_STAGING_SUPERVISORY_API_URL }}
      CBN_TEST_SERVER_SPKI_PINS: ${{ secrets.CBN_STAGING_SUPERVISORY_API_SPKI_PINS }}
      CBN_TEST_OAUTH_TOKEN: ${{ secrets.CBN_STAGING_SUPERVISORY_API_BOUND_TOKEN }}
      CBN_TEST_EVENT_ID_AUTHORIZED: ${{ secrets.CBN_STAGING_SUPERVISORY_API_EVENT_ID_AUTHORIZED }}
      CBN_TEST_EVENT_ID_OUT_OF_SCOPE: ${{ secrets.CBN_STAGING_SUPERVISORY_API_EVENT_ID_OUT_OF_SCOPE }}
      CBN_TEST_EVENT_ID_INTEGRITY_UNAVAILABLE: ${{ secrets.CBN_STAGING_SUPERVISORY_API_EVENT_ID_INTEGRITY_UNAVAILABLE }}
      CBN_TEST_OAUTH_TOKEN_WRONG_SCOPE: ${{ secrets.CBN_STAGING_SUPERVISORY_API_WRONG_SCOPE_TOKEN }}
      CBN_TEST_OAUTH_TOKEN_INVALID: ${{ secrets.CBN_STAGING_SUPERVISORY_API_INVALID_TOKEN }}
      CBN_TEST_BAD_SERVER_SPKI_PINS: ${{ secrets.CBN_STAGING_SUPERVISORY_API_BAD_SPKI_PINS }}
      # Base64-encoded non-production PEM material. This is decoded only into $RUNNER_TEMP.
      CBN_TEST_CA_PEM_B64: ${{ secrets.CBN_STAGING_SUPERVISORY_API_CA_PEM_B64 }}
      CBN_TEST_CLIENT_CERT_PEM_B64: ${{ secrets.CBN_STAGING_SUPERVISORY_API_CLIENT_CERT_PEM_B64 }}
      CBN_TEST_CLIENT_KEY_PEM_B64: ${{ secrets.CBN_STAGING_SUPERVISORY_API_CLIENT_KEY_PEM_B64 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate protected test configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "${EXPECTED_RELEASE_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo 'Staging deployment did not provide a full immutable OCI digest.' >&2
            exit 1
          }
          [[ "${CBN_TEST_BASE_URL}" =~ ^https:// ]] || {
            echo 'CBN_STAGING_SUPERVISORY_API_URL must use HTTPS.' >&2
            exit 1
          }
          for name in \
            CBN_TEST_SERVER_SPKI_PINS \
            CBN_TEST_OAUTH_TOKEN \
            CBN_TEST_EVENT_ID_AUTHORIZED \
            CBN_TEST_EVENT_ID_OUT_OF_SCOPE \
            CBN_TEST_CA_PEM_B64 \
            CBN_TEST_CLIENT_CERT_PEM_B64 \
            CBN_TEST_CLIENT_KEY_PEM_B64; do
            [[ -n "${!name:-}" ]] || { echo "Missing protected staging configuration: ${name}" >&2; exit 1; }
          done
      - name: Materialize short-lived non-production mTLS files
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          credentials_dir="${RUNNER_TEMP}/ndsep-cbn-mtls"
          mkdir -p "${credentials_dir}"
          printf '%s' "${CBN_TEST_CA_PEM_B64}" | base64 --decode > "${credentials_dir}/ca.pem"
          printf '%s' "${CBN_TEST_CLIENT_CERT_PEM_B64}" | base64 --decode > "${credentials_dir}/client.crt"
          printf '%s' "${CBN_TEST_CLIENT_KEY_PEM_B64}" | base64 --decode > "${credentials_dir}/client.key"
          chmod 600 "${credentials_dir}/client.key"
          {
            echo "CBN_TEST_CA_FILE=${credentials_dir}/ca.pem"
            echo "CBN_TEST_CLIENT_CERT_FILE=${credentials_dir}/client.crt"
            echo "CBN_TEST_CLIENT_KEY_FILE=${credentials_dir}/client.key"
            echo "CBN_TEST_EXPECTED_RELEASE_DIGEST=${EXPECTED_RELEASE_DIGEST}"
            echo 'RUN_CBN_CONTRACT_TESTS=true'
          } >> "${GITHUB_ENV}"
      - name: Run mTLS-bound supervisory API acceptance suite
        id: acceptance
        working-directory: tests/supervisory-api-contract
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=spec test/live-api-contract.test.mjs
      - name: Remove mTLS key material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "${RUNNER_TEMP}/ndsep-cbn-mtls"
      - name: Publish non-sensitive acceptance result
        if: always()
        shell: bash
        run: |
          {
            echo '## Staging Supervisory API Acceptance'
            echo
            echo "- Candidate digest: \`${EXPECTED_RELEASE_DIGEST:-missing}\`"
            echo "- Trusted staging deployment: \`${{ github.event.deployment.id || 'manual-revalidation' }}\`"
            echo "- Result: \`${{ steps.acceptance.outcome }}\`"
            echo
            echo 'No token, certificate, private-key, response body, raw evidence, or report content is published.'
          } >> "${GITHUB_STEP_SUMMARY}"
