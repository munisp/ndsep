<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NDSEP — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #e5e7eb; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .container { text-align: center; max-width: 420px; }
    .icon { width: 80px; height: 80px; margin: 0 auto 24px; background: #1f2937; border-radius: 16px; display: flex; align-items: center; justify-content: center; }
    .icon svg { width: 40px; height: 40px; stroke: #10b981; fill: none; stroke-width: 2; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    p { color: #9ca3af; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
    .btn { display: inline-block; background: #10b981; color: #fff; font-size: 15px; font-weight: 600; padding: 12px 24px; border-radius: 8px; text-decoration: none; cursor: pointer; border: none; }
    .btn:hover { background: #059669; }
    .status { margin-top: 16px; font-size: 13px; color: #6b7280; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.56 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01"/></svg>
    </div>
    <h1>You're Offline</h1>
    <p>NDSEP requires a network connection to load fresh compliance and enforcement data. Cached pages may still be available.</p>
    <button class="btn" onclick="window.location.reload()">Try Again</button>
    <div class="status">National Data Sovereignty Enforcement Platform</div>
  </div>
</body>
</html>
