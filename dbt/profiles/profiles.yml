ndsep:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USER', 'ndsep_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'ndsep_secure_2026') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('POSTGRES_DB', 'ndsep_db') }}"
      schema: analytics
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10
      search_path: public,analytics,staging

    prod:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('POSTGRES_DB', 'ndsep_db') }}"
      schema: analytics
      threads: 8
      keepalives_idle: 0
      connect_timeout: 10
      sslmode: require
