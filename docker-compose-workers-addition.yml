# Worker overlay. Apply this file with the environment-specific primary stack;
# it intentionally references shared infrastructure services declared there.

x-resource-defaults: &resource-defaults
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M
      reservations:
        cpus: "0.10"
        memory: 128M
x-default-restart: &default-restart
  restart: unless-stopped
x-hc-defaults: &hc-defaults
  interval: 30s
  timeout: 5s
  retries: 3
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
# ─── Additional Go Workers ────────────────────────────────────────────────────
  anomaly-alert-dispatcher:
    <<: *resource-defaults
    build:
      context: ./workers/go
      dockerfile: Dockerfile
      args:
        CMD: anomaly_alert_dispatcher
    container_name: ndsep-anomaly-alert-dispatcher
    environment:
      WORKER_DATABASE_URL: postgresql://ndsep_user:${POSTGRES_PASSWORD}@postgres:5432/ndsep_db
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      PORT: "8140"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8140/health"]
      <<: *hc-defaults
    logging: *default-logging
    networks:
      - ndsep-internal

  apisix-manager:
