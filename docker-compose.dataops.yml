# ─────────────────────────────────────────────────────────────────────────────
# NDSEP DataOps Stack — Apache NiFi, dbt, Apache Airflow, Trino, Iceberg
# Answers Question 6: The value of NiFi, dbt, and Airflow to NDSEP
#
# VALUE PROPOSITION:
#   Apache NiFi   → Real-time data ingestion, routing, and transformation
#                   for NDPA compliance data flows between agencies, orgs,
#                   and the NDPC. Handles 100k+ events/sec with full lineage.
#   dbt (data build tool) → Transforms raw compliance data into analytics-ready
#                   models. Powers the Compliance Gap Analyzer, Sector
#                   Benchmarks, and Regulatory Intelligence dashboards.
#   Apache Airflow → Orchestrates scheduled compliance workflows: monthly
#                   audit returns, annual DPIA reviews, retention enforcement
#                   sweeps, and cross-agency data reconciliation jobs.
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:
  # ── Apache NiFi — Data Ingestion & Routing ──────────────────────────────────
  # VALUE: Ingests compliance events from 500+ organizations in real-time,
  # routes data to Kafka, PostgreSQL, and the NDSEP API with full audit trail.
  # NDPA Use Cases:
  #   - Automated breach notification ingestion from org portals
  #   - Real-time consent record synchronization across agencies
  #   - Cross-border data transfer monitoring (NDPA Article 43)
  #   - NIN/BVN verification event streaming from NIMC/CBN
  nifi:
    image: apache/nifi:1.25.0
    container_name: ndsep-nifi
    ports:
      - "8443:8443"
    environment:
      NIFI_WEB_HTTPS_PORT: "8443"
      NIFI_WEB_HTTPS_HOST: "0.0.0.0"
      SINGLE_USER_CREDENTIALS_USERNAME: "ndsep_admin"
      SINGLE_USER_CREDENTIALS_PASSWORD: "Ndsep@Nifi2026!"
      NIFI_SENSITIVE_PROPS_KEY: "ndsep_nifi_sensitive_key_2026"
      # Connect to NDSEP PostgreSQL
      NIFI_DATABASE_URL: "jdbc:postgresql://postgres:5432/ndsep_db"
      NIFI_DATABASE_USER: "ndsep_user"
      NIFI_DATABASE_PASSWORD: "ndsep_secure_2026"
      # Connect to Kafka for event streaming
      NIFI_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
      - ./nifi/flows:/opt/nifi/nifi-current/conf/flows
      - ./nifi/templates:/opt/nifi/nifi-current/conf/templates
    networks:
      - ndsep_dataops
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8443/nifi"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Apache NiFi Registry — Flow Version Control ─────────────────────────────
  nifi-registry:
    image: apache/nifi-registry:1.25.0
    container_name: ndsep-nifi-registry
    ports:
      - "18080:18080"
    environment:
      NIFI_REGISTRY_WEB_HTTP_PORT: "18080"
    volumes:
      - nifi_registry_data:/opt/nifi-registry/nifi-registry-current/database
      - nifi_registry_flow:/opt/nifi-registry/nifi-registry-current/flow_storage
    networks:
      - ndsep_dataops
    restart: unless-stopped

  # ── dbt (data build tool) — Analytics Transformation Layer ─────────────────
  # VALUE: Transforms raw NDSEP data into compliance analytics models.
  # Powers dashboards: Compliance Gap Analyzer, Sector Benchmarks,
  # Regulatory Intelligence, PIA Risk Scoring, Vendor Risk Scoring.
  # NDPA Use Cases:
  #   - Monthly compliance score recalculation for all 2,847 registered orgs
  #   - Sector-level benchmarking (Banking, Telecom, Healthcare, Energy)
  #   - Regulatory intelligence: trend analysis across NDPA violations
  #   - Data lineage tracking for cross-agency data shares
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.8.0
    container_name: ndsep-dbt
    working_dir: /dbt
    environment:
      DBT_PROFILES_DIR: /dbt/profiles
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ndsep_db
      POSTGRES_USER: ndsep_user
      POSTGRES_PASSWORD: ndsep_secure_2026
    volumes:
      - ./dbt:/dbt
      - dbt_packages:/dbt/dbt_packages
    networks:
      - ndsep_dataops
    # dbt runs as a CLI tool — use `docker compose run dbt run` or schedule via Airflow
    command: ["run", "--profiles-dir", "/dbt/profiles", "--project-dir", "/dbt"]
    depends_on:
      - postgres-analytics
    profiles:
      - dbt  # Only start when explicitly requested

  # ── Apache Airflow — Workflow Orchestration ─────────────────────────────────
  # VALUE: Orchestrates all scheduled NDSEP compliance workflows with
  # dependency management, retry logic, alerting, and audit trails.
  # NDPA Use Cases:
  #   - Daily: Compliance score recalculation, breach notification SLA checks
  #   - Weekly: Vendor risk rescoring, PIA review reminders
  #   - Monthly: Audit return generation, sector benchmark updates
  #   - Annually: DPIA review cycle, DPO appointment renewal checks
  #   - On-demand: Enforcement action workflows, cross-agency data reconciliation
  airflow-webserver:
    image: apache/airflow:2.9.1
    container_name: ndsep-airflow-webserver
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow_user:airflow_pass_2026@postgres-airflow:5432/airflow_db"
      AIRFLOW__CORE__FERNET_KEY: "ndsep_airflow_fernet_key_2026_base64_encoded_32b=="
      AIRFLOW__WEBSERVER__SECRET_KEY: "ndsep_airflow_webserver_secret_2026"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
      # NDSEP-specific connections
      NDSEP_DB_CONN: "postgresql+psycopg2://ndsep_user:ndsep_secure_2026@postgres:5432/ndsep_db"
      NDSEP_API_URL: "http://ndsep-api:3000"
      NDSEP_API_KEY: "ndsep_internal_api_key_2026"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/logs:/opt/airflow/logs
      - airflow_data:/opt/airflow/data
    networks:
      - ndsep_dataops
    depends_on:
      - postgres-airflow
    restart: unless-stopped
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    image: apache/airflow:2.9.1
    container_name: ndsep-airflow-scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow_user:airflow_pass_2026@postgres-airflow:5432/airflow_db"
      AIRFLOW__CORE__FERNET_KEY: "ndsep_airflow_fernet_key_2026_base64_encoded_32b=="
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      NDSEP_DB_CONN: "postgresql+psycopg2://ndsep_user:ndsep_secure_2026@postgres:5432/ndsep_db"
      NDSEP_API_URL: "http://ndsep-api:3000"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/logs:/opt/airflow/logs
    networks:
      - ndsep_dataops
    depends_on:
      - postgres-airflow
    restart: unless-stopped
    command: scheduler

  airflow-init:
    image: apache/airflow:2.9.1
    container_name: ndsep-airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow_user:airflow_pass_2026@postgres-airflow:5432/airflow_db"
      AIRFLOW__CORE__FERNET_KEY: "ndsep_airflow_fernet_key_2026_base64_encoded_32b=="
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: "ndsep_admin"
      _AIRFLOW_WWW_USER_PASSWORD: "Ndsep@Airflow2026!"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    networks:
      - ndsep_dataops
    depends_on:
      - postgres-airflow
    command: version
    profiles:
      - init

  # ── PostgreSQL for Airflow metadata ─────────────────────────────────────────
  postgres-airflow:
    image: postgres:16-alpine
    container_name: ndsep-postgres-airflow
    environment:
      POSTGRES_DB: airflow_db
      POSTGRES_USER: airflow_user
      POSTGRES_PASSWORD: airflow_pass_2026
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    networks:
      - ndsep_dataops
    restart: unless-stopped

  # ── PostgreSQL Analytics (read replica for dbt) ─────────────────────────────
  postgres-analytics:
    image: postgres:16-alpine
    container_name: ndsep-postgres-analytics
    environment:
      POSTGRES_DB: ndsep_analytics
      POSTGRES_USER: analytics_user
      POSTGRES_PASSWORD: analytics_pass_2026
    volumes:
      - postgres_analytics_data:/var/lib/postgresql/data
      - ./dbt/init:/docker-entrypoint-initdb.d
    networks:
      - ndsep_dataops
    restart: unless-stopped

  # ── Apache Superset — BI Dashboard for dbt models ───────────────────────────
  superset:
    image: apache/superset:3.1.0
    container_name: ndsep-superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "ndsep_superset_secret_2026_very_long_key"
      DATABASE_URL: "postgresql+psycopg2://superset_user:superset_pass@postgres-analytics:5432/ndsep_analytics"
    volumes:
      - superset_data:/app/superset_home
    networks:
      - ndsep_dataops
    restart: unless-stopped

  # ── Trino — Distributed SQL Query Engine ────────────────────────────────────
  # Queries across PostgreSQL, Kafka, Iceberg, and S3 in a single SQL statement
  trino:
    image: trinodb/trino:435
    container_name: ndsep-trino
    ports:
      - "8082:8080"
    volumes:
      - ./trino/etc:/etc/trino
      - ./trino/catalog:/etc/trino/catalog
    networks:
      - ndsep_dataops
    restart: unless-stopped

volumes:
  nifi_conf:
  nifi_content:
  nifi_database:
  nifi_flowfile:
  nifi_provenance:
  nifi_registry_data:
  nifi_registry_flow:
  dbt_packages:
  airflow_data:
  postgres_airflow_data:
  postgres_analytics_data:
  superset_data:

networks:
  ndsep_dataops:
    driver: bridge
    name: ndsep_dataops
