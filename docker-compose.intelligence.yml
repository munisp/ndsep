# NDSEP Intelligence Platform Stack — Docker Compose
# Run: docker compose -f docker-compose.intelligence.yml up -d
# Provides 5 external intelligence platforms integrated into NDSEP:
#   SOCint (CTI Hub), Phantom Tide (Maritime), Wazuh (SIEM),
#   SIGINT (Compound Threats), Estorides (Knowledge Graph)

version: "3.9"

networks:
  ndsep-net:
    external: true
    name: ndsep-ndsep-net

volumes:
  socint_opensearch_data:
  socint_pg_data:
  wazuh_data:
  wazuh_indexer_data:
  estorides_pg_data:
  estorides_neo4j_data:

services:

  # ─── SOCint — Unified CTI Platform ──────────────────────────────────────────
  # Replaces OpenCTI + MISP + TheHive + Cortex
  # 22 built-in connectors, 500+ Sigma rules, NVD + EPSS
  socint-db:
    image: postgres:15-alpine
    networks: [ndsep-net]
    volumes: [socint_pg_data:/var/lib/postgresql/data]
    environment:
      POSTGRES_USER: socint
      POSTGRES_PASSWORD: socint_secure_2026
      POSTGRES_DB: socint_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socint"]
      interval: 10s
      timeout: 5s
      retries: 5

  socint-opensearch:
    image: opensearchproject/opensearch:2.17.0
    networks: [ndsep-net]
    volumes: [socint_opensearch_data:/usr/share/opensearch/data]
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"

  socint:
    image: diagonalciso/socint:latest
    networks: [ndsep-net]
    ports: ["8800:8000"]
    depends_on:
      socint-db: { condition: service_healthy }
      socint-opensearch: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://socint:socint_secure_2026@socint-db:5432/socint_db
      OPENSEARCH_URL: http://socint-opensearch:9200
      SECRET_KEY: ndsep-socint-secret-key-2026
      CORS_ORIGINS: "*"
    restart: unless-stopped

  # ─── Phantom Tide — Maritime Intelligence ───────────────────────────────────
  # AIS tracking, vessel sanctions, anomaly detection, convergence zones
  # Focus: Gulf of Guinea, Niger Delta
  phantomtide:
    image: tg12/phantomtide:latest
    networks: [ndsep-net]
    ports: ["8801:5000"]
    environment:
      AIS_API_KEY: ${AISSTREAM_API_KEY:-}
      SANCTIONS_LISTS: ofac,eu,un
      FOCUS_BBOX: "-5,0,15,15"  # Gulf of Guinea / West Africa
      DATABASE_URL: postgresql://socint:socint_secure_2026@socint-db:5432/socint_db
    depends_on:
      socint-db: { condition: service_healthy }
    restart: unless-stopped

  # ─── Wazuh — SIEM & Compliance Monitoring ───────────────────────────────────
  # Endpoint detection, vulnerability scanning, NDPA/NDPR compliance
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.9.2
    networks: [ndsep-net]
    volumes: [wazuh_indexer_data:/var/lib/wazuh-indexer]
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      plugins.security.disabled: "true"

  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.2
    networks: [ndsep-net]
    ports:
      - "1514:1514"       # Agent registration
      - "1515:1515"       # Agent communication
      - "55000:55000"     # API
    volumes: [wazuh_data:/var/ossec/data]
    environment:
      WAZUH_MANAGER_HOSTNAME: wazuh-manager
      INDEXER_URL: https://wazuh-indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: SecretPassword
    depends_on:
      wazuh-indexer: { condition: service_started }
    restart: unless-stopped

  # ─── SIGINT — Compound Threat Correlation ───────────────────────────────────
  # Aircraft (ADS-B), AIS, seismic (USGS), fires (NASA FIRMS),
  # weather (NOAA), GDELT events, tropical cyclones
  sigint:
    image: iitoneloc/sigint:latest
    networks: [ndsep-net]
    ports: ["8802:3001"]
    environment:
      ADSB_API_URL: https://api.adsb.fi
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
      USGS_FEED_URL: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson
      NASA_FIRMS_KEY: ${NASA_FIRMS_KEY:-}
      GDELT_FOCUS_COUNTRY: NG
      NODE_ENV: production
    restart: unless-stopped

  # ─── Estorides — Knowledge Graph & Entity Resolution ────────────────────────
  # Palantir-style OSINT aggregator, multi-source correlation, LLM analyst
  estorides-db:
    image: postgres:15-alpine
    networks: [ndsep-net]
    volumes: [estorides_pg_data:/var/lib/postgresql/data]
    environment:
      POSTGRES_USER: estorides
      POSTGRES_PASSWORD: estorides_secure_2026
      POSTGRES_DB: estorides_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estorides"]
      interval: 10s
      timeout: 5s
      retries: 5

  estorides-neo4j:
    image: neo4j:5.23-community
    networks: [ndsep-net]
    volumes: [estorides_neo4j_data:/data]
    environment:
      NEO4J_AUTH: neo4j/estorides_graph_2026
      NEO4J_PLUGINS: '["apoc"]'

  estorides:
    image: grisuno/estorides:latest
    networks: [ndsep-net]
    ports: ["8803:8080"]
    depends_on:
      estorides-db: { condition: service_healthy }
      estorides-neo4j: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://estorides:estorides_secure_2026@estorides-db:5432/estorides_db
      NEO4J_URI: bolt://estorides-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: estorides_graph_2026
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      CORS_ORIGINS: "*"
    restart: unless-stopped
