###############################################################################
# NDSEP Production Docker Compose
# Deploys all platform services with production-grade settings.
#
# Usage:
#   docker compose -f docker-compose.production.yml up -d
#   docker compose -f docker-compose.production.yml logs -f ndsep-api
#
# Secrets: copy .env.production.example → .env.production and fill in values.
###############################################################################

version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

x-restart: &default-restart
  restart: unless-stopped

x-resource-defaults: &resource-defaults
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 512m
      reservations:
        cpus: "0.1"
        memory: 128m

x-healthcheck-defaults: &hc-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

services:
  # ─── NDSEP API (Node.js/Express/tRPC) ───────────────────────────────────────
  ndsep-api:
    <<: [*resource-defaults, *default-restart]
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ndsep/api:latest
    container_name: ndsep-api
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: info
      # CORS: comma-separated list of allowed origins for mobile apps
      # Example: https://ndsep.nitda.gov.ng,https://app.ndsep.ng
      CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS is required}"
      NDSEP_DB_URL: postgresql://ndsep_user:${POSTGRES_PASSWORD}@postgres:5432/ndsep_db?sslmode=require
      NDSEP_DB_POOL_MIN: "2"
      NDSEP_DB_POOL_MAX: "20"
      WORKER_RELAY_URL: http://ndsep-api:3000/api/workers/event
      WORKER_DATABASE_URL: postgresql://ndsep_user:${POSTGRES_PASSWORD}@postgres:5432/ndsep_db?sslmode=require
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      OPA_ENABLED: "true"
      OPA_URL: http://opa:8181
      OPA_DECISION_PATH: /v1/data/ndsep/authz/allow
      KEYCLOAK_ISSUER_URL: https://${KEYCLOAK_HOSTNAME:?KEYCLOAK_HOSTNAME is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      <<: *hc-defaults
    logging: *default-logging
    networks:
      - ndsep-internal

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    <<: [*resource-defaults, *default-restart]
    image: postgres:16-alpine
    container_name: ndsep-postgres
    environment:
      POSTGRES_DB: ndsep_db
      POSTGRES_USER: ndsep_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C --data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - backup-data:/var/backups/ndsep
      - ./drizzle/production-indexes.sql:/docker-entrypoint-initdb.d/02-indexes.sql:ro
      - ./drizzle/0019_field_encryption.sql:/docker-entrypoint-initdb.d/03-encryption.sql:ro
      - ./drizzle/0020_citizen_requests_columns.sql:/docker-entrypoint-initdb.d/04-citizen-requests.sql:ro
      - ./infra/postgres/server.crt:/var/lib/postgresql/server.crt:ro
      - ./infra/postgres/server.key:/var/lib/postgresql/server.key:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ndsep_user -d ndsep_db"]
      <<: *hc-defaults
    logging: *default-logging
    networks:
      - ndsep-internal
    # Tuning for production workload
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c log_min_duration_statement=1000
      -c log_checkpoints=on
      -c log_connections=off
      -c log_disconnections=off
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/server.crt
      -c ssl_key_file=/var/lib/postgresql/server.key
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='test ! -f /var/backups/ndsep/wal/%f && cp %p /var/backups/ndsep/wal/%f'
      -c archive_timeout=300

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    <<: [*resource-defaults, *default-restart]
    image: redis:7-alpine
    container_name: ndsep-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --appendonly yes
      --aof-use-rdb-preamble yes
      --loglevel warning
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command DEBUG ""
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      <<: *hc-defaults
    logging: *default-logging
    networks:
      - ndsep-internal

  # ─── PostgreSQL Backup Service ──────────────────────────────────────────────
  pg-backup:
    <<: [*resource-defaults, *default-restart]
    image: postgres:16-alpine
    container_name: ndsep-pg-backup
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: ndsep_user
      PG_DB: ndsep_db
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /var/backups/ndsep
      BACKUP_RETENTION: "30"
      S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      S3_PREFIX: ndsep-backups
      ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-af-south-1}
    volumes:
      - ./scripts/backup-postgres.sh:/opt/ndsep/scripts/backup-postgres.sh:ro
      - ./scripts/restore-postgres.sh:/opt/ndsep/scripts/restore-postgres.sh:ro
      - backup-data:/var/backups/ndsep
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache aws-cli bash
        chmod +x /opt/ndsep/scripts/*.sh
        mkdir -p /var/backups/ndsep/wal /var/log/ndsep
        echo "0 * * * * /opt/ndsep/scripts/backup-postgres.sh --upload-s3 >> /var/log/ndsep/backup.log 2>&1" | crontab -
        echo "0 3 * * 0 /opt/ndsep/scripts/backup-postgres.sh --verify >> /var/log/ndsep/backup-verify.log 2>&1" >> /tmp/cron
        cat /tmp/cron | crontab -
        /opt/ndsep/scripts/backup-postgres.sh
        crond -f
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks:
      - ndsep-internal

  # ─── Apache Kafka ─────────────────────────────────────────────────────────────
  zookeeper:
    <<: [*resource-defaults, *default-restart]
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ndsep-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: WARN
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      <<: *hc-defaults
    logging: *default-logging
    networks:
      - ndsep-internal

  kafka:
    <<: [*resource-defaults, *default-restart]
    image: confluentinc/cp-kafka:7.6.0
    container_name: ndsep-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9092",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    logging: *default-logging
    networks:
      - ndsep-internal

  # ─── Temporal Workflow Engine ─────────────────────────────────────────────────
  temporal:
    <<: [*resource-defaults, *default-restart]
    image: temporalio/auto-setup:1.24
    container_name: ndsep-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: ndsep_user
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      TEMPORAL_ADDRESS: temporal:7233
      LOG_LEVEL: warn
    healthcheck:
      test:
        ["CMD", "temporal", "workflow", "list", "--address", "temporal:7233"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    logging: *default-logging
    networks:
      - ndsep-internal

  # ─── Keycloak (Identity Provider) ────────────────────────────────────────────
  keycloak:
    <<: [*resource-defaults, *default-restart]
    image: quay.io/keycloak/keycloak:24.0
    container_name: ndsep-keycloak
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/ndsep_db
      KC_DB_USERNAME: ndsep_user
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?KEYCLOAK_HOSTNAME is required}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:?KEYCLOAK_ADMIN_USER is required}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_LOG_LEVEL: WARN
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    logging: *default-logging
    networks:
      - ndsep-internal

  # ─── Permify (Authorization Engine) ──────────────────────────────────────────
  permify:
    <<: [*resource-defaults, *default-restart]
    image: ghcr.io/permify/permify:latest
    container_name: ndsep-permify
    command: serve
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: postgresql://ndsep_user:${POSTGRES_PASSWORD}@postgres:5432/ndsep_db
      PERMIFY_LOG_LEVEL: warn
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3476/healthz"]
      <<: *hc-defaults
    logging: *default-logging
    networks:
      - ndsep-internal

  # ─── Apache APISIX (API Gateway) ─────────────────────────────────────────────
  apisix:
    <<: [*resource-defaults, *default-restart]
    image: ghcr.io/openappsec/apisix-attachment:latest
    container_name: ndsep-apisix
    # The OpenAppSec APISIX attachment shares IPC with the inspection agent.
    # Do not replace this image with stock APISIX in a production profile.
    ipc: service:openappsec-agent
    volumes:
      - ./config/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    environment:
      APISIX_STAND_ALONE: "true"
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?APISIX_ADMIN_KEY is required}
    read_only: true
    tmpfs:
      - /tmp
      - /usr/local/apisix/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - ndsep-api
      - openappsec-agent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9180/apisix/admin/routes"]
      <<: *hc-defaults
    logging: *default-logging
    networks:
      - ndsep-internal

  # ─── OpenAppSec inline WAF agent ────────────────────────────────────────────
  openappsec-agent:
    <<: [*resource-defaults, *default-restart]
    image: ghcr.io/openappsec/agent:latest
    container_name: ndsep-openappsec-agent
    ipc: shareable
    environment:
      registered_server: "NDSEP APISIX"
      # Central-management registration is optional. Declarative prevent-mode
      # policy remains local and reviewable when this value is blank.
      user_email: ${OPENAPPSEC_OPERATOR_EMAIL:-}
      AGENT_TOKEN: ${OPENAPPSEC_AGENT_TOKEN:-}
    volumes:
      - waf-config:/etc/cp/conf
      - waf-data:/etc/cp/data
      - waf-logs:/var/log/nano_agent
      - ./infra/openappsec:/ext/appsec:ro
    command: /cp-nano-agent
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    networks:
      - ndsep-internal

  # ─── Caddy public edge ───────────────────────────────────────────────────────
  caddy:
    <<: [*resource-defaults, *default-restart]
    image: caddy:2.8.4-alpine
    container_name: ndsep-caddy
    environment:
      NDSEP_PUBLIC_HOST: ${NDSEP_PUBLIC_HOST:?NDSEP_PUBLIC_HOST is required}
      KEYCLOAK_PUBLIC_HOST: ${KEYCLOAK_HOSTNAME:?KEYCLOAK_HOSTNAME is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "caddy", "version"]
      <<: *hc-defaults
    logging: *default-logging
    networks:
      - ndsep-public
      - ndsep-internal

  # ─── Open Policy Agent (OPA) ─────────────────────────────────────────────────
  opa:
    <<: [*resource-defaults, *default-restart]
    image: openpolicyagent/opa:0.67.0-static
    container_name: ndsep-opa
    command: ["run", "--server", "--addr=:8181", "/policies"]
    volumes:
      - ./infra/opa/policies:/policies:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "opa",
          "eval",
          "--format=raw",
          "--data",
          "/policies",
          "data.ndsep.authz.allow",
        ]
      <<: *hc-defaults
    logging: *default-logging
    networks:
      - ndsep-internal

  # ─── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    <<: [*resource-defaults, *default-restart]
    image: prom/prometheus:v2.51.0
    container_name: ndsep-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--log.level=warn"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      <<: *hc-defaults
    logging: *default-logging
    networks:
      - ndsep-internal

  # ─── Alertmanager ───────────────────────────────────────────────────────────────
  alertmanager:
    <<: [*resource-defaults, *default-restart]
    image: prom/alertmanager:v0.27.0
    container_name: ndsep-alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=http://alertmanager:9093"
      - "--log.level=warn"
    volumes:
      - ./.ndsep-runtime/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./infra/prometheus/templates:/etc/alertmanager/templates:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      <<: *hc-defaults
    logging: *default-logging
    networks:
      - ndsep-internal
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:?SLACK_WEBHOOK_URL is required}
      PAGERDUTY_INTEGRATION_KEY: ${PAGERDUTY_INTEGRATION_KEY:?PAGERDUTY_INTEGRATION_KEY is required}
      NITDA_COMPLIANCE_EMAIL: ${NITDA_COMPLIANCE_EMAIL:?NITDA_COMPLIANCE_EMAIL is required}
      PLATFORM_URL: ${PLATFORM_URL:?PLATFORM_URL is required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}

  # ─── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    <<: [*resource-defaults, *default-restart]
    image: grafana/grafana:10.4.0
    container_name: ndsep-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_LOG_LEVEL: warn
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      <<: *hc-defaults
    logging: *default-logging
    networks:
      - ndsep-internal

  # ─── Banking Workers ────────────────────────────────────────────────────────────
  nip-rtgs-processor:
    <<: [*resource-defaults, *default-restart]
    build:
      context: ./workers/go
      dockerfile: Dockerfile
      args:
        CMD: nip_rtgs_processor
    container_name: ndsep-nip-rtgs
    environment:
      NIP_RTGS_PORT: "8130"
      WORKER_DATABASE_URL: postgresql://ndsep_user:${POSTGRES_PASSWORD}@postgres:5432/ndsep_db
      KAFKA_BROKERS: kafka:9092
      CBN_NIP_ENDPOINT: ${CBN_NIP_ENDPOINT:-https://nip.cbn.gov.ng/api/v1}
      CBN_RTGS_ENDPOINT: ${CBN_RTGS_ENDPOINT:-https://rtgs.cbn.gov.ng/api/v1}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8130/health"]
      <<: *hc-defaults
    logging: *default-logging
    networks:
      - ndsep-internal

  swift-gateway:
    <<: [*resource-defaults, *default-restart]
    build:
      context: ./workers/go
      dockerfile: Dockerfile
      args:
        CMD: swift_gateway
    container_name: ndsep-swift-gateway
    environment:
      SWIFT_GATEWAY_PORT: "8131"
      WORKER_DATABASE_URL: postgresql://ndsep_user:${POSTGRES_PASSWORD}@postgres:5432/ndsep_db
      KAFKA_BROKERS: kafka:9092
      SWIFT_BIC: ${SWIFT_BIC:-NDPCNGLA}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8131/health"]
      <<: *hc-defaults
    logging: *default-logging
    networks:
      - ndsep-internal

  fraud-detection-engine:
    <<: [*resource-defaults, *default-restart]
    build:
      context: ./workers/go
      dockerfile: Dockerfile
      args:
        CMD: fraud_detection_engine
    container_name: ndsep-fraud-engine
    environment:
      FRAUD_ENGINE_PORT: "8132"
      WORKER_DATABASE_URL: postgresql://ndsep_user:${POSTGRES_PASSWORD}@postgres:5432/ndsep_db
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8132/health"]
      <<: *hc-defaults
    logging: *default-logging
    networks:
      - ndsep-internal

  watchlist-screener:
    <<: [*resource-defaults, *default-restart]
    build:
      context: ./workers/rust/watchlist_screener
      dockerfile: Dockerfile
    container_name: ndsep-watchlist-screener
    environment:
      WATCHLIST_PORT: "8133"
      WORKER_DATABASE_URL: postgresql://ndsep_user:${POSTGRES_PASSWORD}@postgres:5432/ndsep_db
      OFAC_API_KEY: ${OFAC_API_KEY:-demo-ofac-key}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8133/health"]
      <<: *hc-defaults
    logging: *default-logging
    networks:
      - ndsep-internal

  aml-scorer:
    <<: [*resource-defaults, *default-restart]
    build:
      context: ./workers/python
      dockerfile: Dockerfile
    container_name: ndsep-aml-scorer
    command: ["python3", "aml_scoring_worker.py"]
    environment:
      AML_SCORER_PORT: "8134"
      WORKER_DATABASE_URL: postgresql://ndsep_user:${POSTGRES_PASSWORD}@postgres:5432/ndsep_db
      KAFKA_BROKERS: kafka:9092
      NFIU_STR_ENDPOINT: ${NFIU_STR_ENDPOINT:-https://api.nfiu.gov.ng/v1/str}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8134/health"]
      <<: *hc-defaults
    logging: *default-logging
    networks:
      - ndsep-internal

  kyc-analyzer:
    <<: [*resource-defaults, *default-restart]
    build:
      context: ./workers/python
      dockerfile: Dockerfile
    container_name: ndsep-kyc-analyzer
    command: ["python3", "kyc_analysis_worker.py"]
    environment:
      KYC_ANALYZER_PORT: "8135"
      WORKER_DATABASE_URL: postgresql://ndsep_user:${POSTGRES_PASSWORD}@postgres:5432/ndsep_db
      BVN_API_ENDPOINT: ${BVN_API_ENDPOINT:-https://api.nibss-plc.org.ng/v1/bvn}
      NIN_API_ENDPOINT: ${NIN_API_ENDPOINT:-https://api.nimc.gov.ng/v1/nin}
      NIBSS_API_KEY: ${NIBSS_API_KEY:-demo-nibss-key}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8135/health"]
      <<: *hc-defaults
    logging: *default-logging
    networks:
      - ndsep-internal

  cbn-reporter:
