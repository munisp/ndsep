# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      # Mount an encrypted filesystem (LUKS/dm-crypt) for data-at-rest encryption.
      # On AWS: use EBS encryption. On GCP: use CMEK. On-prem: use LUKS.
      # Example: sudo cryptsetup luksOpen /dev/sdb encrypted_pg && mount /dev/mapper/encrypted_pg /mnt/pg-data
      device: ${PG_DATA_DIR:-/var/lib/ndsep/postgres-data}
  redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      # Same encrypted filesystem recommendation as PostgreSQL
      device: ${REDIS_DATA_DIR:-/var/lib/ndsep/redis-data}
  backup-data:
    driver: local
  kafka-data:
    driver: local
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  waf-config:
    driver: local
  waf-data:
    driver: local
  waf-logs:
    driver: local
  tls-certs:
    driver: local
    driver_opts:
      type: none
      o: bind
      # For Let's Encrypt production: point to /etc/letsencrypt/live/${DOMAIN}/
      # For local dev self-signed: point to ./infra/nginx/ssl/
      device: ${TLS_CERT_DIR:-./infra/nginx/ssl}
  caddy-data:
    driver: local
  caddy-config:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  ndsep-internal:
    driver: bridge
    internal: true # No external access to internal services
  ndsep-public:
    driver: bridge # Only the Caddy edge connects this network to the internal service mesh
