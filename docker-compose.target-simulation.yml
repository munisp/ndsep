# DEVELOPMENT SIMULATION ONLY — never use these credentials, images, or service states as production evidence.
# This file enables protocol and fail-closed integration tests while target organizations provision managed services.
services:
  payment-audit-postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: idlr_payment
      POSTGRES_USER: idlr_simulation
      POSTGRES_PASSWORD: idlr_simulation
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idlr_simulation -d idlr_payment"]
      interval: 5s
      timeout: 3s
      retries: 20
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: idlr_pts
      MYSQL_USER: idlr_simulation
      MYSQL_PASSWORD: idlr_simulation
      MYSQL_ROOT_PASSWORD: idlr_simulation_root
    ports: ["3307:3306"]
  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: simulation-only
      MINIO_ROOT_PASSWORD: simulation-only-change-before-use
    ports: ["9000:9000", "9001:9001"]
  redis:
    image: redis:7.4-bookworm
    ports: ["6379:6379"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: simulation-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: simulation-only-change-before-use
    volumes:
      - ./docs/keycloak-idlrpts-realm.json:/opt/keycloak/data/import/idlrpts-realm.json:ro
    ports: ["8080:8080"]
