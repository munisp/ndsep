name: Staged Offline Replay Rollout
on:
  pull_request:
  push:
    branches: [production]
permissions:
  contents: read
  id-token: write
  security-events: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
  deploy-staging:
    needs: validate
    if: github.ref == 'refs/heads/production'
    environment: staging
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exchange GitHub OIDC token for cloud workload role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: ./scripts/deploy-replay.sh staging shadow
      - run: ./scripts/run-recovery-drill.sh staging
  progressive-production:
    needs: deploy-staging
    environment: production
    runs-on: ubuntu-24.04
    strategy:
      matrix: { cohort: [1, 10, 25, 50, 100] }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PRODUCTION_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: ./scripts/deploy-replay.sh production ${{ matrix.cohort }}
      - run: ./scripts/rollout-gate.sh production ${{ matrix.cohort }}
