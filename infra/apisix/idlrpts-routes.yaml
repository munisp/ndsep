# Target-environment template. Render secret values only through the deployment secret manager.
# Validate against the deployed APISIX version before activation; this file is not a live gateway.
routes:
  - id: idlr-api
    uri: /api/*
    methods: [GET, POST, PUT, PATCH, DELETE]
    upstream:
      type: roundrobin
      nodes:
        "idlr-api:3000": 1
    plugins:
      openid-connect:
        bearer_only: true
        discovery: "${KEYCLOAK_DISCOVERY}"
        client_id: "${KEYCLOAK_GATEWAY_CLIENT_ID}"
        ssl_verify: true
      limit-req:
        rate: 30
        burst: 15
        key_type: var_combination
        key: "$remote_addr $http_authorization"
        policy: redis
        redis_host: "${APISIX_REDIS_HOST}"
        redis_ssl: true
        redis_ssl_verify: true
        rejected_code: 429
        allow_degradation: false
      limit-conn:
        conn: 20
        burst: 10
        default_conn_delay: 0.1
        rejected_code: 429
      request-validation:
        header_schema:
          type: object
          properties:
            content-type:
              type: string
      opa:
        host: "http://idlr-opa:8181"
        path: "/v1/data/idlrpts/authz"
        policy: "require"
        ssl_verify: false
      prometheus: {}
  - id: idlr-webhooks
    uri: /api/gateway-webhooks/*
    methods: [POST]
    upstream:
      type: roundrobin
      nodes:
        "idlr-api:3000": 1
    plugins:
      limit-req:
        rate: 10
        burst: 5
        key: remote_addr
        rejected_code: 429
        allow_degradation: false
