  namespace: ndsep
  labels:
    app: kyc-worker
    domain: banking
    scaler: keda
spec:
  scaleTargetRef:
    name: kyc-worker
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 8
  fallback:
    failureThreshold: 3
    replicas: 2
