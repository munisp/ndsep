###############################################################################
# KEDA ScaledObjects — Event-Driven Autoscaling for NDSEP Workers & API
# Apply: kubectl apply -f infra/k8s/keda-scaledobjects.yaml
#
# Scaling triggers:
#   - Kafka consumer lag (workers consuming from ndsep.* topics)
#   - HTTP request rate via Prometheus (API pods)
#   - Cron-based (compliance rescorer during WAT business hours)
#   - Redis queue length (DLQ processor)
#
# All ScaledObjects use:
#   - cooldownPeriod: 300s (prevent flapping)
#   - pollingInterval: 30s (check every 30s)
#   - fallback: replicas from Deployment spec
###############################################################################

# ─── API Layer: HTTP Request Rate ─────────────────────────────────────────────
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ndsep-api-keda
  namespace: ndsep
  labels:
    app: ndsep-api
    scaler: keda
spec:
  scaleTargetRef:
    name: ndsep-api
  pollingInterval: 15
  cooldownPeriod: 120
  minReplicaCount: 2
  maxReplicaCount: 20
  fallback:
    failureThreshold: 3
    replicas: 2
  triggers:
    # Scale on HTTP request rate (requests/second per pod)
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring:9090
        metricName: http_requests_per_second
        query: |
          sum(rate(http_request_duration_seconds_count{app="ndsep-api"}[2m]))
          / count(up{app="ndsep-api"})
        threshold: "50"
        activationThreshold: "10"
      authenticationRef:
        name: prometheus-trigger-auth
    # Scale on P95 latency exceeding 500ms
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring:9090
        metricName: http_p95_latency
        query: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{app="ndsep-api"}[5m]))
            by (le)
          )
        threshold: "0.5"
      authenticationRef:
        name: prometheus-trigger-auth
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Pods
              value: 3
              periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60

