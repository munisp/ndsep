# Dedicated payment-provider ingress. Do not merge this path into the general
# public ingress: NGINX client-certificate verification is an Ingress-level control.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ndsep-mojaloop-callback
  namespace: ndsep
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Secret contains ca.crt for the approved Mojaloop client/egress CA only.
    nginx.ingress.kubernetes.io/auth-tls-secret: ndsep/mojaloop-client-ca
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "2"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "256k"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "10"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-connections: "5"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-NDSEP-mTLS-Verified $ssl_client_verify;
      proxy_set_header X-NDSEP-mTLS-Subject $ssl_client_s_dn;
      proxy_set_header X-NDSEP-mTLS-Issuer $ssl_client_i_dn;
      proxy_set_header X-NDSEP-mTLS-Serial $ssl_client_serial;
      proxy_set_header X-NDSEP-mTLS-Cert $ssl_client_escaped_cert;
spec:
  tls:
    - hosts:
        - callbacks.ndsep.nitda.gov.ng
      secretName: ndsep-mojaloop-callback-server-tls
  rules:
    - host: callbacks.ndsep.nitda.gov.ng
      http:
        paths:
          - path: /api/mojaloop/
            pathType: Prefix
            backend:
              service:
                name: ndsep-api
                port:
                  number: 80
