# NDSEP Worker Services — Kubernetes Deployment Manifests
# All workers: non-root, resource limits, liveness/readiness probes, graceful termination

apiVersion: v1
kind: ConfigMap
metadata:
  name: ndsep-worker-config
  namespace: ndsep
data:
  KAFKA_BROKERS: "kafka:9092"
  REDIS_URL: "redis://redis:6379"
  TEMPORAL_HOST: "temporal:7233"
  DAPR_HTTP_PORT: "3500"
  LOG_LEVEL: "info"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
---
# BGP Validator (Go) - 2 replicas with HPA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bgp-validator
  namespace: ndsep
  labels: { app: bgp-validator, tier: worker, language: go }
spec:
  replicas: 2
  selector:
    matchLabels: { app: bgp-validator }
  template:
    metadata:
      labels: { app: bgp-validator, tier: worker }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      terminationGracePeriodSeconds: 30
      containers:
        - name: bgp-validator
          image: ndsep/bgp-validator:latest
          command: ["/app/bgp_validator"]
          envFrom:
            - configMapRef: { name: ndsep-worker-config }
            - secretRef: { name: ndsep-secrets }
          ports: [{ containerPort: 8081, name: health }]
          livenessProbe:
            httpGet: { path: /health, port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
