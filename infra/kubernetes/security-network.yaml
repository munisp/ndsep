apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: idlr-api-default-deny
  namespace: idlr-pts
spec:
  podSelector:
    matchLabels:
      app: idlr-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: idlr-apisix
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: idlr-pts
      ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8181
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: idlr-api
  namespace: idlr-pts
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: idlr-api
