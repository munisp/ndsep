###############################################################################
# NDSEP Production Nginx Configuration
# - TLS 1.2/1.3 only
# - HSTS, CSP, X-Frame-Options, X-Content-Type-Options
# - Rate limiting on API and auth endpoints
# - Gzip compression
# - WebSocket proxy for live updates
###############################################################################

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging ────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
        '"ts":"$time_iso8601",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"ip":"$remote_addr",'
        '"ua":"$http_user_agent",'
        '"ref":"$http_referer"'
        '}';
    access_log /var/log/nginx/access.log json_combined;

    # ─── Performance ────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    # ─── Gzip ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # ─── Rate Limiting ──────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=global:10m rate=200r/m;
    limit_req_status 429;

    # ─── SSL Settings ───────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ─── Upstream ───────────────────────────────────────────────
    upstream ndsep_api {
        server ndsep-api:3000;
        keepalive 32;
    }

    # ─── HTTP → HTTPS Redirect ──────────────────────────────────
    # In production with WAF: WAF handles ports 80/443, nginx listens on 8080.
    # Without WAF (dev/staging): nginx handles ports 80/443 directly.
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ─── Internal HTTP Server (behind WAF) ────────────────────────
    # WAF terminates TLS and forwards to this port.
    server {
        listen 8080;
        server_name _;

        # WAF forwards real client IP via X-Forwarded-For
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        real_ip_header X-Forwarded-For;

        # Forward all requests to the HTTPS server block's locations
        include /etc/nginx/conf.d/locations.conf;
    }

    # ─── HTTPS Server ───────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name ndsep.nitda.gov.ng;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_trusted_certificate /etc/nginx/ssl/chain.pem;

        # ─── Security Headers ──────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' wss: https:; frame-ancestors 'self';" always;

        # ─── Auth Rate Limiting ────────────────────────────────
        location /api/oauth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://ndsep_api;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ─── API Rate Limiting ─────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://ndsep_api;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ─── WebSocket (live updates) ──────────────────────────
        location /ws {
            proxy_pass http://ndsep_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ─── Static Assets (long cache) ───────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://ndsep_api;
            include /etc/nginx/conf.d/proxy_params.conf;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ─── All Other Requests ────────────────────────────────
        location / {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://ndsep_api;
            include /etc/nginx/conf.d/proxy_params.conf;
        }
    }
}
