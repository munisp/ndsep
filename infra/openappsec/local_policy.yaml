policies:
  default:
    triggers:
      - ndsep-security-trigger
    mode: prevent-learn
    practices:
      - ndsep-api-practice
    custom-response: ndsep-block-response
    specific-rules: []

practices:
  - name: ndsep-api-practice
    openapi-schema-validation:
      configmap: []
      override-mode: prevent-learn
    snort-signatures:
      configmap: []
      override-mode: prevent-learn
    web-attacks:
      # The Caddy edge applies a stricter 16 MB request cap. These are parser
      # safety ceilings for the WAF attachment itself.
      max-body-size-kb: 16384
      max-header-size-bytes: 32768
      max-object-depth: 32
      max-url-size-bytes: 8192
      minimum-confidence: medium
      override-mode: prevent-learn
      protections:
        csrf-protection: inactive
        error-disclosure: inactive
        non-valid-http-methods: true
        open-redirect: prevent-learn
    anti-bot:
      injected-URIs: []
      validated-URIs: []
      override-mode: prevent-learn

log-triggers:
  - name: ndsep-security-trigger
    access-control-logging:
      allow-events: false
      drop-events: true
    additional-suspicious-events-logging: enabled
    minimum-severity: medium
    response-body: false
    appsec-logging:
      all-web-requests: false
      detect-events: true
      prevent-events: true
    extended-logging:
      # Prevent sensitive request content from being duplicated into WAF logs.
      http-headers: false
      request-body: false
      url-path: false
      url-query: false
    log-destination:
      cloud: false
      stdout:
        format: json

custom-responses:
  - name: ndsep-block-response
    mode: response-code-only
    http-response-code: 403
