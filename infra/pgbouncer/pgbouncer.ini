; NDSEP pgBouncer Connection Pooling Configuration
; ==================================================
; Provides connection pooling for PostgreSQL to handle
; high concurrent connection loads efficiently.
;
; Default mode: transaction pooling (best for web apps)
; Max client connections: 500
; Max server connections: 50 (matches PostgreSQL max_connections)

[databases]
; Use environment variable for connection string
ndsep_db = host=${POSTGRES_HOST:-postgres} port=${POSTGRES_PORT:-5432} dbname=${POSTGRES_DB:-ndsep_db} auth_user=${POSTGRES_USER:-ndsep_user}

[pgbouncer]
; Connection settings
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Pool sizing
pool_mode = transaction
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
max_client_conn = 500
max_db_connections = 50

; Timeouts
server_connect_timeout = 15
server_idle_timeout = 600
server_lifetime = 3600
client_idle_timeout = 300
client_login_timeout = 60
query_timeout = 300
query_wait_timeout = 120

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

; Security
server_tls_sslmode = prefer
server_tls_ca_file = /etc/pgbouncer/ca.crt

; Admin access
admin_users = ndsep_admin
stats_users = ndsep_monitor
