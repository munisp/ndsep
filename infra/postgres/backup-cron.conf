# ─────────────────────────────────────────────────────────────────────────────
# NDSEP Backup Cron Schedule
# ─────────────────────────────────────────────────────────────────────────────
# Install: crontab -l | cat - infra/postgres/backup-cron.conf | crontab -
# ─────────────────────────────────────────────────────────────────────────────

# Hourly incremental backup (pg_dump, compressed, to local + S3)
0 * * * * /opt/ndsep/scripts/backup-postgres.sh --upload-s3 >> /var/log/ndsep/backup.log 2>&1

# Weekly full backup verification (restore to temp DB, check table counts)
0 3 * * 0 /opt/ndsep/scripts/backup-postgres.sh --verify >> /var/log/ndsep/backup-verify.log 2>&1

# Daily cleanup of WAL archives older than 7 days (S3 lifecycle handles long-term)
0 4 * * * find /var/backups/ndsep/wal -mtime +7 -delete >> /var/log/ndsep/wal-cleanup.log 2>&1
