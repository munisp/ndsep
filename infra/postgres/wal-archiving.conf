# ─────────────────────────────────────────────────────────────────────────────
# NDSEP PostgreSQL WAL Archiving Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Append to postgresql.conf or include via include_dir.
# Enables Write-Ahead Log archiving for Point-in-Time Recovery (PITR).
#
# RTO target: < 1 hour
# RPO target: < 15 minutes (WAL segments archived every ~5 min)
# ─────────────────────────────────────────────────────────────────────────────

# Enable WAL archiving
wal_level = replica
archive_mode = on

# Archive to local directory (override for S3 in production)
# For S3: archive_command = 'aws s3 cp %p s3://BUCKET/wal/%f --sse aws:kms'
archive_command = 'test ! -f /var/backups/ndsep/wal/%f && cp %p /var/backups/ndsep/wal/%f'
archive_timeout = 300

# WAL retention for replication slots
max_wal_senders = 5
wal_keep_size = 2GB

# Checkpointing (balance between recovery speed and I/O)
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB

# Logging for monitoring
log_checkpoints = on
log_connections = on
log_disconnections = on
