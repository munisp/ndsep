# NDSEP PostgREST for sovereign-data workers.
# The egress_monitor and adverse_media workers reach Postgres ONLY through
# PostgREST (see migration 0121 for the role/RLS side).
#
# Auth model (PostgREST standard):
#   - db-uri uses ndsep_postgrest_authenticator (LOGIN granted out of band,
#     NOINHERIT). It owns zero table privileges.
#   - Workers present a JWT with {"role": "ndsep_worker"} signed with
#     PGRST_JWT_SECRET; PostgREST SET LOCAL ROLE ndsep_worker per request.
#   - Unauthenticated requests land in db-anon-role = ndsep_postgrest_anon,
#     which has NO table privileges (fail closed).
#
# $(VAR) entries are expanded from the container environment by PostgREST.

db-uri = "postgresql://ndsep_postgrest_authenticator:$(PGRST_AUTHENTICATOR_PASSWORD)@$(PGRST_DB_HOST):$(PGRST_DB_PORT)/$(PGRST_DB_NAME)"
db-schemas = "public"
db-anon-role = "ndsep_postgrest_anon"
db-extra-search-path = "public"

# Symmetric JWT secret shared with the worker token minter. >= 32 chars.
jwt-secret = "$(PGRST_JWT_SECRET)"
jwt-secret-is-base64 = false
role-claim-key = ".role"

server-host = "0.0.0.0"
server-port = 3000

# Workers write rollups/violations in small bursts; keep the pool tight.
db-pool = 10
db-pool-timeout = 10
max-rows = 5000

# No OpenAPI root exposure beyond what ndsep_postgrest_anon can see (nothing).
openapi-mode = "disabled"
