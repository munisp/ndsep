###############################################################################
# NDSEP Prometheus Alerting Rules
# Covers: API health, database, workers, compliance SLAs, security events
###############################################################################

groups:
  # ─── API / Application ─────────────────────────────────────────────────────
  - name: ndsep-api
    interval: 30s
    rules:
      - alert: APIDown
        expr: up{job="ndsep-api"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "NDSEP API is down"
          description: "The NDSEP API has been unreachable for more than 1 minute."

      - alert: HighAPIErrorRate
        expr: |
          rate(http_requests_total{job="ndsep-api",status=~"5.."}[5m])
          / rate(http_requests_total{job="ndsep-api"}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High API error rate (>5%)"
          description: "API 5xx error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: SlowAPIResponses
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket{job="ndsep-api"}[5m])
          ) > 2
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Slow API responses (p95 > 2s)"
          description: "95th percentile API response time is {{ $value | humanizeDuration }}."

  # ─── Database ──────────────────────────────────────────────────────────────
  - name: ndsep-database
    interval: 30s
    rules:
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL has been unreachable for more than 1 minute."

      - alert: PostgresHighConnections
        expr: pg_stat_activity_count > 150
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "PostgreSQL connection count high (>150)"
          description: "Current connections: {{ $value }}. Max is 200."

      - alert: PostgresSlowQueries
        expr: pg_stat_activity_max_tx_duration > 30
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Long-running PostgreSQL query detected"
          description: "A query has been running for {{ $value | humanizeDuration }}."

      - alert: PostgresDiskUsageHigh
        expr: |
          pg_database_size_bytes{datname="ndsep_db"}
          / (1024 * 1024 * 1024) > 10
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "PostgreSQL database size > 10GB"
          description: "Database size is {{ $value | humanize }}GB."

  # ─── Workers ───────────────────────────────────────────────────────────────
  - name: ndsep-workers
    interval: 60s
    rules:
      - alert: WorkerDown
        expr: up{job=~"ndsep-worker-.*"} == 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "NDSEP worker {{ $labels.job }} is down"
          description: "Worker {{ $labels.job }} has been unreachable for 5 minutes."

      - alert: KafkaConsumerLag
        expr: kafka_consumer_group_lag > 10000
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Kafka consumer lag is high"
          description: "Consumer group {{ $labels.consumergroup }} lag: {{ $value }} messages."

  # ─── Webhook shadow queue ──────────────────────────────────────────────────
  - name: ndsep-webhook-shadow
    interval: 30s
    rules:
      - alert: WebhookShadowQueueIntentFailure
        expr: |
          max(ndsep_webhook_shadow_mode) == 1
          and sum(increase(ndsep_webhook_shadow_enqueue_errors_total[5m])) > 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Webhook shadow queue cannot persist delivery intent"
          description: "One or more shadow queue intents failed to persist over 5 minutes while shadow mode is enabled. Keep worker claiming disabled, investigate PostgreSQL availability/constraints, and reconcile the canonical ledger before any cutover."

      - alert: WebhookShadowQueueFinalizationFailure
        expr: |
          max(ndsep_webhook_shadow_mode) == 1
          and sum(increase(ndsep_webhook_shadow_finalization_errors_total[5m])) > 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Webhook shadow queue finalization diverged from the canonical ledger"
          description: "A canonical webhook outcome was recorded but its shadow queue row could not be finalized. Keep worker claiming disabled and run the read-only reconciliation check for the approved canary window."

      - alert: WebhookShadowTerminalErrorRateHigh
        expr: |
          max(ndsep_webhook_shadow_mode) == 1
          and sum(increase(ndsep_webhook_shadow_finalizations_total{outcome="dead"}[5m])) >= 5
          and (
            sum(increase(ndsep_webhook_shadow_finalizations_total{outcome="dead"}[5m]))
            /
            clamp_min(sum(increase(ndsep_webhook_shadow_finalizations_total[5m])), 1)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Webhook shadow terminal error rate exceeds 5%"
          description: "More than 5% of finalized shadow delivery rows are dead over 5 minutes, with at least five terminal failures. Pause canary advancement and inspect remote delivery failures plus canonical-ledger reconciliation."

      - alert: WebhookShadowMetricsUnavailable
        expr: |
          max_over_time(ndsep_webhook_shadow_mode[2m]) == 1
          and absent_over_time(ndsep_webhook_shadow_enqueued_total[2m])
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Webhook shadow telemetry is unavailable"
          description: "Shadow mode is active but the API metrics scrape no longer exposes webhook shadow counters. Do not accept a canary window without observable queue evidence."

  # ─── Compliance SLA ────────────────────────────────────────────────────────
  - name: ndsep-compliance
    interval: 300s
    rules:
      - alert: CitizenRequestSLAMetricUnavailable
        expr: ndsep_citizen_request_sla_metric_available != 1
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Citizen-request SLA metric source is unavailable"
          description: "The NDSEP API could not evaluate the citizen-request SLA source query. Resolve metrics/database access before relying on SLA alert coverage."

      - alert: CitizenRequestSLABreach
        expr: ndsep_citizen_requests_sla_breached > 0
        for: 0m
        labels:
          severity: critical
          team: compliance
        annotations:
          summary: "Citizen data requests exceeding 30-day SLA"
          description: "{{ $value }} citizen requests have exceeded the statutory 30-day response window."

      - alert: HighCriticalComplianceAlerts
        expr: |
          increase(ndsep_compliance_alerts_total{severity="critical"}[1h]) > 5
        for: 0m
        labels:
          severity: critical
          team: compliance
        annotations:
          summary: "Spike in critical compliance alerts"
          description: "{{ $value }} critical compliance alerts in the last hour."

  # ─── Security ──────────────────────────────────────────────────────────────
  - name: ndsep-security
    interval: 60s
    rules:
      - alert: HighAuthFailureRate
        expr: |
          rate(ndsep_auth_failures_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "High authentication failure rate"
          description: "Auth failures: {{ $value | humanize }}/s over the last 5 minutes."

      - alert: SuspiciousBGPRoute
        expr: ndsep_bgp_invalid_routes_total > 0
        for: 0m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Invalid BGP route detected"
          description: "{{ $value }} BGP routes with RPKI status INVALID detected."

      - alert: APISIXGatewayMetricsDown
        expr: up{job="apisix"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "APISIX gateway metrics endpoint is unreachable"
          description: "Prometheus cannot scrape the internal APISIX metrics listener for more than 2 minutes. Confirm APISIX availability and that only the internal metrics port is reachable."

      - alert: APISIXRateLimitSaturation
        expr: |
          (
            sum(rate(apisix_http_status{code="429"}[5m]))
            /
            clamp_min(sum(rate(apisix_http_status[5m])), 0.1)
          ) > 0.02
          and sum(increase(apisix_http_status{code="429"}[5m])) >= 20
        for: 5m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "APISIX rate-limit saturation exceeds 2%"
          description: "{{ $value | humanizePercentage }} of APISIX responses are 429 over 5 minutes (at least 20 throttled requests). Check abusive sources, trusted client-IP handling, and route limits before raising capacity."

      - alert: APISIXRateLimitAttackOrMisconfiguration
        expr: |
          (
            sum(rate(apisix_http_status{code="429"}[1m]))
            /
            clamp_min(sum(rate(apisix_http_status[1m])), 0.1)
          ) > 0.10
          and sum(increase(apisix_http_status{code="429"}[1m])) >= 50
        for: 2m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "APISIX 429 rate exceeds 10%"
          description: "{{ $value | humanizePercentage }} of APISIX responses are throttled over 1 minute (at least 50). Treat as active abuse or trusted-proxy/rate-policy failure; invoke the edge incident runbook."

      - alert: OPAServiceDown
        expr: up{job="opa"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "OPA policy service is unreachable"
          description: "The OPA internal metrics target has been down for more than 1 minute. Privileged NDSEP actions must fail closed; investigate before restoring availability."

      - alert: OPAPolicyTimeouts
        expr: |
          sum(increase(ndsep_opa_decisions_total{outcome="timeout"}[5m])) >= 3
          and
          (
            sum(increase(ndsep_opa_decisions_total{outcome="timeout"}[5m]))
            /
            clamp_min(sum(increase(ndsep_opa_decisions_total[5m])), 1)
          ) > 0.01
        for: 2m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "OPA policy evaluation timeout rate exceeds 1%"
          description: "{{ $value | humanizePercentage }} of OPA decisions timed out over 5 minutes (at least 3). Privileged requests are denied; inspect OPA CPU, policy bundle, DNS/network path, and API timeout budget."

      - alert: OPAFailClosedDenialsSpike
        expr: |
          sum(increase(ndsep_opa_decisions_total{outcome=~"unconfigured|unavailable|http_error|malformed|timeout"}[5m])) >= 10
        for: 2m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "OPA fail-closed infrastructure denials are spiking"
          description: "{{ $value }} privileged authorization decisions failed due to OPA configuration, availability, response, or timeout errors in 5 minutes. Do not disable OPA; restore the policy dependency."

  # ─── Infrastructure ────────────────────────────────────────────────────────
  - name: ndsep-infra
    interval: 60s
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | humanize }}% for 10 minutes."

      - alert: HighMemoryUsage
        expr: |
          (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | humanize }}%."

      - alert: DiskSpaceLow
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"}) * 100 > 85
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk {{ $labels.mountpoint }} is {{ $value | humanize }}% full."

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Redis is down"
          description: "Redis has been unreachable for 2 minutes."
