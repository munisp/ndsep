global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s
  external_labels:
    environment: production
    service: ndsep

# ─── Alerting ─────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
      scheme: http
      timeout: 10s
      api_version: v2

# ─── Rule Files ───────────────────────────────────────────────
rule_files:
  - "/etc/prometheus/alerts.yml"

# ─── Scrape Configs ───────────────────────────────────────────
scrape_configs:

  # NDSEP API metrics
  - job_name: ndsep-api
    static_configs:
      - targets: ["ndsep-api:3000"]
    metrics_path: /api/metrics
    scrape_interval: 15s

  # APISIX metrics are exposed only on the internal gateway metrics listener.
  - job_name: apisix
    static_configs:
      - targets: ["apisix:9091"]
    metrics_path: /apisix/prometheus/metrics
    scrape_interval: 15s
    scrape_timeout: 5s

  # OPA exposes service and Go runtime health metrics internally. Detailed
  # authorization outcome/latency metrics come from the ndsep-api scrape.
  - job_name: opa
    static_configs:
      - targets: ["opa:8181"]
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 5s

  # PostgreSQL (via postgres_exporter)
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
    scrape_interval: 30s

  # Redis (via redis_exporter)
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
    scrape_interval: 30s

  # Kafka (via kafka_exporter)
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
    scrape_interval: 30s

  # Node exporter (host metrics)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
    scrape_interval: 30s

  # Alertmanager self-monitoring
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
    scrape_interval: 30s

  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Phase 25 — Go Workers (ports 8150-8153)
  - job_name: dapr-bridge
    static_configs:
      - targets: ["dapr-bridge:8150"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: fluvio-relay
    static_configs:
      - targets: ["fluvio-relay:8151"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: mojaloop-adapter
    static_configs:
      - targets: ["mojaloop-adapter:8152"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: apisix-manager
    static_configs:
      - targets: ["apisix-manager:8153"]
    metrics_path: /metrics
    scrape_interval: 15s

  # Phase 25 — Rust Workers (ports 8160-8163)
  - job_name: tigerbeetle-worker
    static_configs:
      - targets: ["tigerbeetle-worker:8160"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: opensearch-indexer
    static_configs:
      - targets: ["opensearch-indexer:8161"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: keycloak-validator
    static_configs:
      - targets: ["keycloak-validator:8162"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: lakehouse-ingest
    static_configs:
      - targets: ["lakehouse-ingest:8163"]
    metrics_path: /metrics
    scrape_interval: 15s

  # Phase 25 — Python Workers (ports 8164-8167)
  - job_name: permify-rbac-sync
    static_configs:
      - targets: ["permify-rbac-sync:8164"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: fluvio-consumer
    static_configs:
      - targets: ["fluvio-consumer:8165"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: opensearch-query
    static_configs:
      - targets: ["opensearch-query:8166"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: dapr-state-bridge
    static_configs:
      - targets: ["dapr-state-bridge:8167"]
    metrics_path: /metrics
    scrape_interval: 15s
