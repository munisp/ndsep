apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-twin-v2
  labels:
    app: digital-twin-v2
    tier: simulation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: digital-twin-v2
  template:
    metadata:
      labels:
        app: digital-twin-v2
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "digital-twin"
        dapr.io/app-port: "8175"
    spec:
      containers:
        - name: digital-twin
          image: ndsep/digital-twin-v2:latest
          ports:
            - containerPort: 8175
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ndsep-db
                  key: url
            - name: KAFKA_URL
              value: "kafka:9092"
            - name: REDIS_URL
              value: "redis:6379"
            - name: TEMPORAL_URL
              value: "temporal:7233"
            - name: DAPR_URL
              value: "http://localhost:3500"
            - name: MONTE_CARLO_URL
              value: "http://monte-carlo:8177"
            - name: AGENT_MODEL_URL
              value: "http://agent-model:8178"
            - name: SYSTEM_DYNAMICS_URL
              value: "http://system-dynamics:8179"
            - name: ML_PREDICTION_URL
              value: "http://ml-predictor:8176"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8175
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8175
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: digital-twin-v2
spec:
  selector:
    app: digital-twin-v2
  ports:
    - port: 8175
      targetPort: 8175
---
