---
# ─────────────────────────────────────────────────────────────────────────────
# NDSEP Kubernetes Production Deployment
# National Data Sovereignty Enforcement Platform
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: ndsep
  labels:
    app.kubernetes.io/name: ndsep
    app.kubernetes.io/part-of: ndpc-platform
    environment: production

---
# ── ConfigMap ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: ndsep-config
  namespace: ndsep
data:
  NODE_ENV: "production"
  PORT: "3000"
  OTEL_SERVICE_NAME: "ndsep-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  REDIS_URL: "redis://redis-service:6379"
  NIFI_URL: "http://nifi-service:8080"
  AIRFLOW_URL: "http://airflow-service:8080"

---
# ── Secret (values injected by CI/CD) ────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: ndsep-secrets
  namespace: ndsep
type: Opaque
stringData:
  DATABASE_URL: "postgresql://ndsep_user:CHANGE_ME@postgres-service:5432/ndsep_db?sslmode=require"
  JWT_SECRET: "CHANGE_ME_32_CHAR_SECRET"
  STRIPE_SECRET_KEY: "sk_live_CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "whsec_CHANGE_ME"

---
# ── NDSEP API Deployment ──────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ndsep-api
  namespace: ndsep
  labels:
    app: ndsep-api
    version: "12.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ndsep-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ndsep-api
        version: "12.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/metrics"
    spec:
      serviceAccountName: ndsep-api-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: ndsep-api
          image: ndpc/ndsep-api:12.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: ndsep-config
            - secretRef:
                name: ndsep-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - ndsep-api
                topologyKey: kubernetes.io/hostname

---
# ── NDSEP API Service ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: ndsep-api-service
  namespace: ndsep
  labels:
    app: ndsep-api
spec:
  selector:
    app: ndsep-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      name: http
  type: ClusterIP

---
# ── Horizontal Pod Autoscaler ─────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ndsep-api-hpa
  namespace: ndsep
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ndsep-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# ── Ingress ───────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ndsep-ingress
  namespace: ndsep
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - ndsep.ndpc.gov.ng
        - api.ndsep.ndpc.gov.ng
      secretName: ndsep-tls
  rules:
    - host: ndsep.ndpc.gov.ng
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ndsep-api-service
                port:
                  number: 80

---
# ── ServiceAccount ────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ndsep-api-sa
  namespace: ndsep
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/ndsep-api-role"

---
# ── NetworkPolicy ─────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ndsep-api-netpol
  namespace: ndsep
spec:
  podSelector:
    matchLabels:
      app: ndsep-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ndsep
      ports:
        - protocol: TCP
          port: 5432  # PostgreSQL
        - protocol: TCP
          port: 6379  # Redis
        - protocol: TCP
          port: 9092  # Kafka
    - to: []  # Allow external HTTPS (Stripe, OAuth, etc.)
      ports:
        - protocol: TCP
          port: 443

---
# ── PostgreSQL StatefulSet ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ndsep
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: ndsep_db
            - name: POSTGRES_USER
              value: ndsep_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ndsep-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ndsep_user", "-d", "ndsep_db"]
            initialDelaySeconds: 10
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: ndsep
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
---
# ── Redis StatefulSet ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: ndsep
spec:
  serviceName: redis-service
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ndsep-secrets
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: ndsep
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  clusterIP: None
---
# ── NDSEP Worker Deployment ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ndsep-worker
  namespace: ndsep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ndsep-worker
  template:
    metadata:
      labels:
        app: ndsep-worker
    spec:
      serviceAccountName: ndsep-api-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: ndsep-worker
          image: ndsep/api:latest
          command: ["node", "dist/server/workerManager.js"]
          env:
            - name: NODE_ENV
              value: production
            - name: WORKER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ndsep-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ndsep-secrets
                  key: REDIS_URL
            - name: WORKER_RELAY_URL
              value: http://ndsep-api-service:3000/api/workers/event
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
