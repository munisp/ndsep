version: "3.9"

services:
  app:
    image: node:22-bookworm
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev:server"
    volumes:
      - ./:/workspace
    ports:
      - "3000:3000"
      - "8081:8081"
    env_file:
      - .env
    depends_on:
      postgresql:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  postgresql:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${MOBILE_POSTGRES_DB:?MOBILE_POSTGRES_DB is required}
      POSTGRES_USER: ${MOBILE_POSTGRES_USER:?MOBILE_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${MOBILE_POSTGRES_PASSWORD:?MOBILE_POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  postgresql_data:
  minio_data:
  ollama_data:
