version: "3.9"

services:
  app:
    image: node:22-bookworm
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm dev:server"
    volumes:
      - ./:/workspace
    ports:
      - "3000:3000"
      - "8081:8081"
    env_file:
      - .env
    depends_on:
      - mysql
      - ollama
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: idlr_pts
      MYSQL_USER: idlr
      MYSQL_PASSWORD: idlrpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  mysql_data:
  minio_data:
  ollama_data:
