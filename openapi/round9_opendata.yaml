openapi: 3.0.3
info:
  title: NDSEP Open Data Portal (round 9)
  version: "1"
  description: >
    Public, no-login aggregate datasets exposed by the openDataPortal tRPC
    router. Datasets are sanitised aggregates only: complaint statistics
    enforce a k-anonymity threshold of 5 (cells below the threshold are
    returned as "<5"), and every access is logged with a salted SHA-256
    accessor hash (raw IP/identity never stored). Datasets are versioned with
    an admin-managed changelog (open_data_datasets table).
paths:
  /openDataPortal.listDatasets:
    get:
      summary: Dataset catalogue with versions and changelogs
      operationId: listDatasets
      tags: [open-data]
      responses:
        "200":
          description: Catalogue entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatasetMeta"
  /openDataPortal.getDataset:
    get:
      summary: Fetch a dataset as JSON or CSV (aggregate only)
      operationId: getDataset
      tags: [open-data]
      parameters:
        - name: input
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/GetDatasetInput"
      responses:
        "200":
          description: Dataset payload (JSON rows or CSV string)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DatasetJson"
                  - $ref: "#/components/schemas/DatasetCsv"
        "404":
          description: Dataset not found or unpublished
components:
  schemas:
    DatasetMeta:
      type: object
      properties:
        dataset_key:
          type: string
          enum: [sanctions_register, complaint_stats, dcpmi_registry, enforcement_outcomes]
        title: { type: string }
        description: { type: string }
        version: { type: integer, minimum: 1 }
        changelog:
          type: array
          items:
            type: object
            properties:
              version: { type: integer }
              changed_at: { type: string, format: date-time }
              changed_by: { type: string }
              note: { type: string }
        published: { type: boolean }
        updated_at: { type: string, format: date-time }
    GetDatasetInput:
      type: object
      required: [dataset]
      properties:
        dataset:
          type: string
          enum: [sanctions_register, complaint_stats, dcpmi_registry, enforcement_outcomes]
        format: { type: string, enum: [json, csv], default: json }
        year: { type: integer, minimum: 2020, maximum: 2100 }
    DatasetJson:
      type: object
      properties:
        dataset: { type: string }
        version: { type: integer }
        format: { type: string, enum: [json] }
        k_anonymity_threshold:
          type: [integer, "null"]
          description: "5 for complaint_stats; null otherwise"
        rows:
          type: array
          items:
            type: object
            additionalProperties:
              type: [string, number, "null"]
          description: >
            Aggregate rows. complaint_stats rows carry
            {category, state, month, count} with count="<5" for suppressed
            cells. No row-level personal data is ever returned.
    DatasetCsv:
      type: object
      properties:
        dataset: { type: string }
        version: { type: integer }
        format: { type: string, enum: [csv] }
        csv: { type: string, description: "RFC-4180 CSV with header row" }
