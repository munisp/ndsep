[package]
name = "ndsep-wasm"
description = "WASM modules for NDSEP mobile and web — PQC verification, compliance scoring, offline computation"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde.workspace = true
serde_json.workspace = true
sha3 = "0.10"
getrandom = { version = "0.2", features = ["js"] }

[dependencies.web-sys]
version = "0.3"
features = ["console"]
