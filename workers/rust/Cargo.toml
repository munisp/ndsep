[workspace]
members = [
    "shared",
    "bgp_validator",
    "residency_enforcer",
    "financial_ledger",
    "sla_tracker",
    "evidence_signer",
    "watchlist_screener",
    "vector_cache",
    "lakehouse_writer",
    "keycloak_validator",
    "lakehouse_ingest",
    "middleware_cache",
    "opensearch_indexer",
    "portability_exporter",
    "tigerbeetle_ledger",
    "offline_resilience",
    "wiredigg",
    "noc_collector",
    "noc_uptime",
    "noc_agent_perception",
    "monte_carlo",
    "agent_sim",
    "system_dynamics",
    "audit_chain",
    "quantum_crypto",
    "wasm_edge",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.7", features = ["json"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
sha2 = "0.10"
hex = "0.4"
lazy_static = "1"
