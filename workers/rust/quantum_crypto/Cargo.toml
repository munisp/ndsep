[package]
name = "quantum_crypto"
version = "0.1.0"
edition = "2021"
description = "Post-quantum cryptographic operations: CRYSTALS-Kyber key exchange, CRYSTALS-Dilithium signatures"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
rand = "0.8"
aes-gcm = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
tower-http = { version = "0.5", features = ["cors"] }
base64 = "0.22"
