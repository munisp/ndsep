[package]
name = "sla_tracker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sla_tracker"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-postgres = { workspace = true }
warp = { version = "0.4", features = ["server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
