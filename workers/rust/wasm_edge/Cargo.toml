[package]
name = "wasm_edge"
version = "0.1.0"
edition = "2021"
description = "WASM-compiled edge processing for browser/IoT packet analysis and anomaly detection"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
